name: CI

on:
  push:
    branches: [ main, feature/** ]
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports:
          - 2181:2181
        options: >-
          --health-cmd "echo ruok | nc -w 2 localhost 2181 || exit 1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 8

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports:
          - 9092:9092
        options: >-
          --health-cmd "cub kafka-ready -b localhost:9092 1 20"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install -r agent_service/requirements.txt
          pip install -r agent_orchestrator/requirements.txt
          pip install -r requirements-dev.txt

      - name: Set PYTHONPATH
        run: echo "PYTHONPATH=$PWD:$PWD/agent_service:$PWD/agent_orchestrator:$PYTHONPATH" >> $GITHUB_ENV

      - name: Run tests
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: agent_knowledge-base-256
          PINECONE_ENV: test-env
          OLLAMA_BASE_URL: http://localhost:11434
          KAFKA_BROKER: kafka:9092
        run: pytest -q agent_service/tests agent_orchestrator/tests tests

      - name: Build service images
        run: |
          docker build -t ${{ github.repository }}-agent_orch -f agent_orchestrator/Dockerfile .
          docker build -t ${{ github.repository }}-agent_srv  -f agent_service/Dockerfile .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ github.repository }}-agent_orch ${{ secrets.DOCKERHUB_USER }}/agent-orchestrator:latest
          docker tag ${{ github.repository }}-agent_srv  ${{ secrets.DOCKERHUB_USER }}/agent-service:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/agent-orchestrator:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/agent-service:latest
