name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
      - chore/**
      - debug/**
  pull_request:

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      zookeeper:
        image: confluentinc/cp-zookeeper:7.5.0
        env:
          ZOOKEEPER_CLIENT_PORT: 2181
          ZOOKEEPER_TICK_TIME: 2000
        ports: [ "2181:2181" ]
        options: >-
          --health-cmd="echo ruok | nc -w 2 localhost 2181 || exit 1" --health-interval=5s --health-timeout=5s --health-retries=8

      kafka:
        image: confluentinc/cp-kafka:7.5.0
        env:
          KAFKA_BROKER_ID: 1
          KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        ports: [ "9092:9092" ]
        options: >-
          --health-cmd="cub kafka-ready -b localhost:9092 1 20" --health-interval=10s --health-timeout=5s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}

      - name: Install dependencies
        run: |
          pip install -r agent_service/requirements.txt
          pip install -r agent_orchestrator/requirements.txt
          pip install -r requirements-dev.txt

      - name: Export PYTHONPATH
        run: |
          echo "PYTHONPATH=$PWD:$PWD/agent_service:$PWD/agent_orchestrator:$PWD/agent_orchestrator/app:$PYTHONPATH" >> $GITHUB_ENV

      - name: Shim legacy import paths
        run: |
          python - <<'PY'
          import sys, types, importlib.util, pathlib
          root = pathlib.Path('.').resolve()
          orch_engine = root / 'agent_orchestrator' / 'app' / 'orchestrator_engine.py'
          if orch_engine.exists():
              spec = importlib.util.spec_from_file_location('app.orchestrator.orchestrator_engine', orch_engine)
              mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              pkg = types.ModuleType('app.orchestrator'); pkg.orchestrator_engine = mod
              sys.modules['app.orchestrator'] = pkg
              sys.modules['app.orchestrator.orchestrator_engine'] = mod
          prod_spec = importlib.util.spec_from_file_location(
              'agent_service.app.kafka_client.producer',
              root / 'agent_service' / 'app' / 'kafka_client' / 'producer.py'
          )
          prod = importlib.util.module_from_spec(prod_spec); prod_spec.loader.exec_module(prod)
          if not hasattr(prod, 'init_kafka_producer'):
              prod.init_kafka_producer = lambda *a, **k: None
          sys.modules['agent_service.app.kafka_client.producer'] = prod
          PY

      - name: Cache grpcurl
        id: grpcurl-cache
        uses: actions/cache@v4
        with:
          path: ~/grpcurl
          key: grpcurl-v1

      - name: Install grpcurl
        if: steps.grpcurl-cache.outputs.cache-hit != 'true'
        run: |
          curl -L https://github.com/fullstorydev/grpcurl/releases/download/v1.8.9/grpcurl_1.8.9_linux_x86_64.tar.gz -o grpcurl.tgz
          mkdir -p ~/grpcurl
          tar -xzf grpcurl.tgz -C ~/grpcurl
          echo "PATH=$HOME/grpcurl:$PATH" >> $GITHUB_ENV

      - name: Add grpcurl to PATH
        if: steps.grpcurl-cache.outputs.cache-hit == 'true'
        run: echo "PATH=$HOME/grpcurl:$PATH" >> $GITHUB_ENV

      - name: Launch services
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_ENV: test-env
          KAFKA_BROKER: host.docker.internal:9092
        run: docker compose -f docker-compose.yml up -d --no-deps agent_service agent_orchestrator

      - name: gRPC health check
        run: |
          for i in {1..10}; do
            if grpcurl -plaintext localhost:50051 list > /dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          exit 1

      - name: Run tests
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: agent_knowledge-base-256
          PINECONE_ENV: test-env
          OLLAMA_BASE_URL: http://localhost:11434
          KAFKA_BROKER: localhost:9092
          AGENT_GRPC_URL: localhost:50051
        run: pytest -q agent_service/tests agent_orchestrator/tests tests

      - name: Build images
        run: |
          docker build -t ${{ github.repository }}-agent_orch -f agent_orchestrator/Dockerfile .
          docker build -t ${{ github.repository }}-agent_srv  -f agent_service/Dockerfile .

      - name: Login Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push images
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{ github.repository }}-agent_orch ${{ secrets.DOCKERHUB_USER }}/agent-orchestrator:latest
          docker tag ${{ github.repository }}-agent_srv  ${{ secrets.DOCKERHUB_USER }}/agent-service:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/agent-orchestrator:latest
          docker push ${{ secrets.DOCKERHUB_USER }}/agent-service:latest
